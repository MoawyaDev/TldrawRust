[package]
name = "gpuii"
version = "0.1.0"
edition = "2024"
description = "A native infinite-canvas whiteboard and visual thinking application"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
epaint_default_fonts = "=0.37.0"
fontdue = "=0.9.5"
rfd = { version = "=0.17.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-skia = { version = "=0.12.0", features = ["png-format"] }
uuid = { version = "1.22", features = ["serde", "v4"] }
